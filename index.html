<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dolce&Salato FoodTruck Menu</title>

    <style>

        body {
            margin: 0;
            padding: 30px;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .gallery {
    	max-width: 1000px;
   	margin: auto;
	}

	.gallery img {
   	width: 100%;
    	height: auto;
   	display: block;
  	margin-bottom: 20px;
	}

        @media (max-width: 700px) {

            body {
                padding: 10px;
            }

            .gallery {
                grid-template-columns: 1fr;
                gap: 10px;
            }

        }

    </style>

</head>

<body>

    <div class="gallery">

        <img src="immagini/foto1.jpeg">
        <img src="immagini/foto2.jpeg">
        <img src="immagini/foto3.jpeg">
        <img src="immagini/foto4.jpeg">
	<img src="immagini/foto5.jpeg">
	<img src="immagini/foto6.jpeg">

    </div>

</body>

</html>
